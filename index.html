  checkJobs(); bankTotals();
  state = 'over'; Aud.engine(false, 0); Aud.sfx('lose'); vibe([80, 60, 120]);
  var earned = Math.round(cash);
  save.wallet += earned;
  var newBest = earned > save.best; if (newBest) save.best = earned;
  var st = save.stats; st.runs++; st.km += dist / 1000; st.booms += run.booms; st.near += run.near; st.crates += run.crates; st.earned += earned;
  persist();
  var res = { reason: reason, earned: earned, best: save.best, newBest: newBest, km: dist / 1000, run: run, sub: lbSubmit(earned) };
  setTimeout(function () { if (state === 'over') UIH.over(res); }, 800);
}

/* ================= particles + text ================= */
function pop(x, y, text, color, big) { pops.push({ x: x, y: y, text: text, color: color || '#3ddc97', life: big ? 1.3 : 0.95, big: !!big }); }
function burst(x, y, n, col, spd, life, size, grav) {
  if (lq()) n = Math.ceil(n / 3);
  for (var i = 0; i < n && parts.length < 420; i++) {
    var a = Math.random() * TAU, v = spd * (0.3 + Math.random() * 0.7);
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (0.6 + Math.random() * 0.4), max: life, col: col, r: size * (0.5 + Math.random() * 0.8), g: grav || 0, kind: 'dot' });
  }
}
function smoke(x, y, n) {
  if (lq()) n = Math.ceil(n / 3);
  for (var i = 0; i < n && parts.length < 420; i++) parts.push({ x: x + (Math.random() - .5) * 16, y: y + (Math.random() - .5) * 10, vx: (Math.random() - .5) * 20, vy: -20 - Math.random() * 30, life: 1.4, max: 1.4, col: '#3a3a3a', r: 6 + Math.random() * 6, g: 0, kind: 'smoke' });
}
function explode(x, y, power, safe) {
  power = power || 1;
  burst(x, y, 34 * power, '#ffd060', 260 * power, 0.55, 4, 0);
  burst(x, y, 24 * power, '#ff6a2a', 180 * power, 0.8, 5, 0);
  burst(x, y, 14 * power, '#2a2a2a', 140 * power, 1.0, 3, 220);
  smoke(x, y, 10 * power);
  parts.push({ x: x, y: y, vx: 0, vy: 0, life: 0.45, max: 0.45, col: '#fff3c0', r: 70 * power, kind: 'ring' });
  parts.push({ x: x, y: y, vx: 0, vy: 0, life: 0.25, max: 0.25, col: '#ffffff', r: 50 * power, kind: 'flash' });
  shakeT = Math.max(shakeT, 0.9 * power); flash = Math.max(flash, 0.25 * power);
  Aud.sfx('boom'); vibe(90);
  run.booms++;
  if (!safe && state === 'play') {
    var dx = P.x - x, dy = P.y - y, dd = Math.sqrt(dx * dx + dy * dy);
    if (dd < 78 * power && inv <= 0) {
      if (S.fire) pop(P.x, P.y - 50, 'Fireproof!', '#ffb020');
      else takeHit('Caught in the blast');
    }
  }
}

/* ================= spawning ================= */
function laneBusy(l, top) {
  var lim = top == null ? 160 : top, i;
  for (i = 0; i < traffic.length; i++) { var c = traffic[i]; if (c.lane === l && c.y < lim && c.y > -260) return true; if (c.flip && c.lane === l && c.y < 60) return true; }
  for (i = 0; i < items.length; i++) if (items[i].lane === l && items[i].y < 90) return true;
  for (i = 0; i < warns.length; i++) if (warns[i].lane === l) return true;
  return false;
}
function takeLane(free) { return free.splice(Math.floor(Math.random() * free.length), 1)[0]; }
function mkCar(lane, y, f, beh) {
  var kn = pick(pool, Math.random()), tries = 0;
  while ((beh === 'wrong' || beh === 'over') && (kn === 'semi' || kn === 'truck' || kn === 'bus') && tries++ < 10) kn = pick(pool, Math.random());
  var k = TK[kn], big = kn === 'semi' || kn === 'truck' || kn === 'bus';
  var spec = { t: k.t, w: k.w, h: k.h, color: k.color || pick(TCOL, Math.random()), sign: k.sign, bar: k.bar, stripe: kn === 'muscle' && Math.random() < .5, spoiler: kn === 'sports' || kn === 'super',
               box: pick(SEMI_BOX, Math.random()), band: Math.random() < .45 ? pick(TCOL, Math.random()) : null };
  if (kn === 'semi') spec.h = 118 + Math.floor(Math.random() * 18);
  if (big && beh !== 'stall' && beh !== 'wrong' && beh !== 'over') f = Math.max(f, 0.72 + Math.random() * 0.16);
  if ((kn === 'sports' || kn === 'super') && beh === 'norm') f = Math.min(f, 0.18 + Math.random() * 0.3);
  var ag = M.aggr;
  return { spec: spec, kind: kn, big: big, turn: kn === 'semi' ? 1.05 : (big ? 1.4 : 3), lane: lane, x: laneX(lane), y: y - (big ? spec.h * .35 : 0), w: spec.w, h: spec.h, f: f, eff: f,
           beh: beh || 'norm', flip: false, wreck: false, wt: 1 + Math.random() * 2, reckless: !big && Math.random() < 0.05 * ag * ag, brake: false, near: false, burn: 0,
           pend: null, sigT: 0, sig: 0, sigHold: 0 };
}
function stallRate() { return M.id === 'night' ? 0.14 : (M.aggr >= 1.3 ? 0.09 : 0.06); }
function spawnStall(lane) { var c = mkCar(lane, -100, 1, 'stall'); c.sig = 2; c.reckless = false; traffic.push(c); }
function laneClear(c, l) {
  var lx = laneX(l), i, o;
  for (i = 0; i < traffic.length; i++) { o = traffic[i]; if (o !== c && Math.abs(o.x - lx) < (o.w + c.w) / 2 + 2 && Math.abs(o.y - c.y) < (o.h + c.h) / 2 + 34) return false; }
  for (i = 0; i < items.length; i++) { o = items[i]; if ((o.type === 'rock' || o.type === 'barrel') && Math.abs(o.x - lx) < 30 && Math.abs(o.y - c.y) < c.h / 2 + 60) return false; }
  return true;
}
function wantLane(c, nl, tm) { if (c.pend != null) return; c.pend = nl; c.sigT = tm != null ? tm : (c.big ? 1.1 : 0.65); c.sig = nl > c.lane ? 1 : -1; c.sigHold = 0; }
function spawnTick(iv) {
  var i, lane, all = [], near = {}, nearCount = 0, ag = M.aggr * (1 + Math.min(1, t / 150) * 0.5);
  for (i = 0; i < LANES; i++) all.push(i);
  traffic.forEach(function (c) { if (c.y < 250 && c.y > -200 && !near[c.lane]) { near[c.lane] = 1; nearCount++; } });
  items.forEach(function (c) { if ((c.type === 'rock' || c.type === 'barrel') && c.y < 250 && !near[c.lane]) { near[c.lane] = 1; nearCount++; } });
  var free = all.filter(function (l) { return !laneBusy(l); });
  if (!free.length) return;
  var limit = LANES - 1;
  var n = (t > 12 && Math.random() < 0.3 + 0.1 * ag) ? 2 : 1;
  if (LANES >= 5 && t > 25 && Math.random() < 0.25 * ag) n++;
  for (i = 0; i < n; i++) {
    if (!free.length || nearCount >= limit) break;
    lane = takeLane(free);
    var r = Math.random(), beh = 'norm', f = 0.32 + Math.random() * (0.3 + 0.1 * ag);
    if (r < 0.1 * ag) { beh = 'weave'; }

    nearCount++;
  }
  // wrong-way drivers and overtakers on tougher maps
  var lead = S.radar ? 1.7 : 0.9;
  if (ag >= 1.15 && t > 12 && Math.random() < 0.05 * (ag - 0.75) && free.length) {
    lane = takeLane(free); warns.push({ lane: lane, side: 'top', t: lead, max: lead });
  } else if (ag >= 0.85 && t > 18 && Math.random() < 0.04 * ag) {
    var cand = all.filter(function (l) { return !traffic.some(function (c) { return c.lane === l && c.y > H - 260; }); });
    if (cand.length) { lane = pick(cand, Math.random()); warns.push({ lane: lane, side: 'bottom', t: lead, max: lead }); }

      var p = Math.random();
      type = p < 0.3 ? 'shield' : p < 0.58 ? 'magnet' : p < 0.76 ? 'dbl' : p < 0.9 ? 'bag' : (lives < maxLives ? 'repair' : 'bag');
    }
    if (type) { lane = takeLane(free); items.push({ type: type, lane: lane, x: laneX(lane), y: -30, w: 30, h: 30 }); }
  }
  if (free.length && Math.random() < Math.min(0.85, 0.5 * S.crateRate)) { lane = takeLane(free); items.push({ type: 'crate', lane: lane, x: laneX(lane), y: -30, w: 30, h: 30 }); }
}

function spawnWarned(w) {
  var c;
  if (w.side === 'stall') { spawnStall(w.lane); return; }
  if (w.side === 'top') { c = mkCar(w.lane, -120, 1.75, 'wrong'); c.flip = true; c.reckless = true; }
  else { c = mkCar(w.lane, H + 90, -0.32, 'over'); c.reckless = false; c.wt = 0; c.spec.color = pick(['#c8202f', '#f2b705', '#1e4fa8', '#e2701a'], Math.random()); c.spec.spoiler = true; }
  traffic.push(c);
}

/* ================= helpers ================= */
function hit(a, b, pad) { pad = pad == null ? 4 : pad; return Math.abs(a.x - b.x) < (a.w + b.w) / 2 - pad && Math.abs(a.y - b.y) < (a.h + b.h) / 2 - pad - 2; }
function cashGain(base) { return Math.max(5, Math.round(base * S.pay * M.cash * (dbl > 0 ? 2 : 1) / 5) * 5); }
function wreckCar(c, boomPower, safe) {
  if (c.wreck) return;
  c.wreck = true; c.f = 1; c.eff = 1; c.beh = 'wreck'; c.burn = 6 + Math.random() * 4;
  explode(c.x, c.y, boomPower || 1, safe);
  if (S.hook && state === 'play' && Math.random() < 0.8) items.push({ type: 'crate', lane: c.lane, x: c.x + (Math.random() - .5) * 20, y: c.y - c.h / 2 - 20, w: 30, h: 30, salvage: true });
}

function takeHit(why) {
  if (inv > 0 || state !== 'play') return false;
  if (S.crumple && !crumpleUsed) { crumpleUsed = true; inv = 1.2; shakeT = 0.6; pop(P.x, P.y - 60, 'Crumple zone saved you', '#9be7ff', true); Aud.sfx('crash'); return false; }
  shakeT = 1; vibe(70); Aud.sfx('crash');
  if (!S.bull) streak = 0;
  burst(P.x, P.y - P.h / 2, 16, '#ffd060', 160, 0.4, 2.5, 0);
  if (shield > 0) { shield--; inv = 1.0; run.cleanMax = Math.max(run.cleanMax, (dist - run.lastHit) / 1000); run.lastHit = dist; pop(P.x, P.y - 60, shield > 0 ? 'Shield ' + shield + ' left' : 'Shield down', '#5bc0ff'); return false; }
  run.cleanMax = Math.max(run.cleanMax, (dist - run.lastHit) / 1000); run.lastHit = dist;
  lives--; inv = S.recover;
  if (lives <= 0) { finish(why || 'Wrecked'); return true; }
  pop(P.x, P.y - 60, lives === 1 ? 'Last life!' : '-1 life', '#ff5d5d', lives === 1);
  return false;
}

function collect(it) {
  var g;
  switch (it.type) {
    case 'crate':
      g = cashGain(100 * multNow());
      if (S.lucky && Math.random() < 0.08) { g *= 3; pop(it.x, it.y - 18, 'LUCKY x3', '#ffd23f', true); }
      cash += g; streak++; run.crates++;
      pop(it.x, it.y, '+$' + g); Aud.sfx('pick');
      burst(it.x, it.y, 8, '#3ddc97', 90, 0.4, 2, 0);
      break;
    case 'fuel': fuel = Math.min(100, fuel + S.can); run.fuel++; pop(it.x, it.y, '+Fuel', '#ff8a3d'); Aud.sfx('fuel'); break;
    case 'shield':
      if (shield >= S.shieldMax) { g = cashGain(100); cash += g; pop(it.x, it.y, '+$' + g, '#5bc0ff'); }
      else { shield++; pop(it.x, it.y, shield > 1 ? 'Shield x' + shield : 'Shield', '#5bc0ff'); }
      Aud.sfx('power'); break;
    case 'magnet': magnet = S.mag; pop(it.x, it.y, 'Magnet', '#b57bff'); Aud.sfx('power'); break;
    case 'dbl': dbl = 9; pop(it.x, it.y, 'Double cash!', '#ffd23f', true); Aud.sfx('power'); break;
    case 'bag': g = cashGain(400); cash += g; pop(it.x, it.y, '+$' + g, '#ffd23f', true); Aud.sfx('buy'); break;
    case 'repair': if (lives < maxLives) { lives++; pop(it.x, it.y, '+1 life', '#ff8a8a', true); } else { g = cashGain(150); cash += g; pop(it.x, it.y, '+$' + g); } Aud.sfx('fuel'); break;
  }
}

function move(d) {
  if (state !== 'play') return;
  if (slip > 0.25) return;
  var nl = clamp(P.lane + d, 0, LANES - 1);
  if (nl !== P.lane) { P.lane = nl; Aud.sfx('click'); if (S.look.smoke && !lq()) for (var q = 0; q < 6; q++) parts.push({ x: P.x + (Math.random() - .5) * P.w, y: P.y + P.h / 2, vx: (Math.random() - .5) * 40, vy: 10 + Math.random() * 20, life: 0.9, max: 0.9, col: S.look.smoke, tint: S.look.smoke, r: 5 + Math.random() * 4, g: 0, kind: 'smoke' }); }
}

/* ================= jobs tracking ================= */
function cleanNow() { return Math.max(run.cleanMax, (dist - run.lastHit) / 1000); }
function jobVal(j) {
  switch (j.k) {
    case 'crates': return run.crates; case 'km': return dist / 1000; case 'near': return run.near; case 'smash': return run.smash;
    case 'clean': return cleanNow(); case 'fuel': return run.fuel; case 'booms': return run.booms; case 'earn': return cash;
    case 'tcrate': return (j.prog || 0) + run.crates; case 'tkm': return (j.prog || 0) + dist / 1000;
    case 'mapearn': return save.map === j.map ? cash : 0; case 'classkm': return S.car.cls === j.cls ? dist / 1000 : 0;
  }

}
var JOB_SHORT = { crates: 'Crates', km: 'Distance', near: 'Near misses', clean: 'Clean km', fuel: 'Fuel cans', booms: 'Explosions', earn: 'Earnings', tcrate: 'Crates total', tkm: 'Total km', mapearn: 'Map cash', classkm: 'Class km' };
function jobFmt(j, v) { var t = jobTypeOf(j.k); if (j.k === 'earn' || j.k === 'mapearn') return fmt(Math.min(v, j.n)) + '/' + fmt(j.n); return (t.dec ? Math.min(v, j.n).toFixed(1) : Math.floor(Math.min(v, j.n))) + '/' + j.n; }

      save.jobs.board = save.jobs.board.filter(function (b) { return b.id !== j.id; });
      save.jobs.active = save.jobs.active.filter(function (id) { return id !== j.id; });
      fillBoard(); persist();
      pop(P.x, P.y - 90, 'JOB DONE +' + fmt(r), '#ffd23f', true); Aud.sfx('buy'); vibe([40, 40, 40]);

function bankTotals() {
  activeJobs().forEach(function (j) { if (j.k === 'tcrate') j.prog = (j.prog || 0) + run.crates; if (j.k === 'tkm') j.prog = (j.prog || 0) + dist / 1000; });
}

/* ================= update ================= */
function updateWx(dt, speed) {
  for (var i = 0; i < wx.length; i++) {
    var f = wx[i];
    if (M.weather === 'rain') { f.y += (560 + speed * 0.6) * f.v * dt; f.x -= 60 * dt; if (f.y > H) { f.y = -10; f.x = Math.random() * (W + 60); } }
    else if (M.weather === 'snow') { f.y += (40 + speed * 0.18) * f.v * dt; f.x += Math.sin(clock * 1.5 + f.p) * 14 * dt; if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; } }
    else { f.y -= 36 * f.v * dt; f.x += Math.sin(clock * 2 + f.p) * 16 * dt; if (f.y < -4) { f.y = H + 4; f.x = Math.random() * W; } }
  }
}

function update(dt) {
  var speed = speedNow(), i, j, c, d, it;
  if (state === 'paused' || state === 'over') { updateParts(dt); return; }
  scroll += speed * dt;
  updateWx(dt, speed);
  updateParts(dt);
  if (state === 'menu') return;

  if (state === 'count') {
    countT -= dt;
    var cn = Math.ceil(countT - 0.2);
    if (cn !== lastCount) { lastCount = cn; if (cn > 0 && cn <= 3) Aud.sfx('tick'); else if (cn <= 0) Aud.sfx('go'); }
    if (countT <= 0) state = 'play';
    return;
  }

  t += dt; dist += speed * dt / 40;
  var steer = S.agility * (S.ice ? 1 : lerp(M.steer, 1, S.grip));
  if (slip > 0) { slip -= dt; steer *= 0.25; }
  var tx = laneX(P.lane), ox = P.x;
  P.x += (tx - P.x) * Math.min(1, dt * steer);
  P.tilt = lerp(P.tilt, clamp((P.x - ox) / Math.max(dt, 0.001) / 900, -0.22, 0.22), Math.min(1, dt * 12));
  inv = Math.max(0, inv - dt); shakeT = Math.max(0, shakeT - dt * 2.6); flash = Math.max(0, flash - dt * 2);
  magnet = Math.max(0, magnet - dt); dbl = Math.max(0, dbl - dt);
  // exhaust flames mod: little embers trail off the exhaust
  if (S.look.flames && !lq() && Math.random() < 0.35) burst(P.x + (Math.random() < .5 ? -1 : 1) * P.w * .22, P.y + P.h / 2 + 3, 1, S.look.flames, 50, 0.25, 2.2, 0);
  if (S.look.sparks && Math.random() < 0.5) burst(P.x + (Math.random() - .5) * P.w * .6, P.y + P.h / 2, 1, '#ffd98a', 120, 0.25, 1.4, 300);
  Aud.engine(true, clamp((speed - 250) / 700, 0, 1));

  fuel -= (2.4 + Math.min(1.6, t * 0.03)) * S.drain * (M.drain || 1) * dt;
  if (fuel < 12 && S.reserve && !reserveUsed) { reserveUsed = true; fuel += 30; pop(P.x, P.y - 60, 'Reserve tank +30 fuel', '#ff8a3d', true); Aud.sfx('fuel'); }
  if (fuel <= 0) { fuel = 0; finish('Out of fuel'); return; }
  if (fuel < 20 && Math.floor(t * 2) !== Math.floor((t - dt) * 2) && Math.floor(t * 2) % 4 === 0) Aud.sfx('warn');

  // lightning
  if (M.lightning) { nextBolt -= dt; if (nextBolt <= 0) { flash = 0.8; nextBolt = 5 + Math.random() * 8; Aud.sfx('boom'); } }

  // spawning
  var iv = Math.max(0.36, 0.95 - t * 0.008) / (M.traffic || 1);
  spawnT -= dt;
  if (spawnT <= 0) { spawnTick(iv); spawnT = iv; }
  for (i = warns.length - 1; i >= 0; i--) { warns[i].t -= dt; if (warns[i].t <= 0) { spawnWarned(warns[i]); warns.splice(i, 1); } }

  // traffic brains: realistic following, braking, signalling and lane changes
  for (i = 0; i < traffic.length; i++) {
    c = traffic[i];
    if (c.wreck) { c.eff = 1; c.sig = 0; continue; }
    if (c.beh === 'stall') { c.eff = 1; c.brake = false; c.sig = 2; continue; }
    var f = c.f; c.brake = false; c.wt -= dt;
    if (!c.flip && c.f > 0 && !c.reckless) {
      var block = null, bd = 1e9;
      for (j = 0; j < traffic.length; j++) {
        d = traffic[j]; if (d === c || d.flip) continue;
        if (Math.abs(d.x - c.x) < (d.w + c.w) / 2 && d.y < c.y) { var gap = c.y - d.y - (c.h + d.h) / 2; if (gap < (c.big ? 90 : 60) && gap < bd && d.eff > f) { bd = gap; block = d; } }
      }
      for (j = 0; j < items.length; j++) {
        d = items[j]; if (d.type !== 'rock' && d.type !== 'barrel') continue;
        if (Math.abs(d.x - c.x) < (d.w + c.w) / 2 && d.y < c.y) { var g2 = c.y - d.y - (c.h + d.h) / 2; if (g2 < 80 && g2 < bd) { bd = g2; block = { eff: 1, wreck: true }; } }
      }
      if (block) {
        f = Math.max(f, Math.min(block.eff, 1)); c.brake = true;
        var reason = block.eff >= 0.98 || block.big || c.beh === 'weave' || block.eff > c.f + 0.1;
        if (c.pend == null && c.wt <= 0 && reason) {
          var opts = [c.lane - 1, c.lane + 1].filter(function (l) { return l >= 0 && l < LANES && laneClear(c, l); });
          if (opts.length) wantLane(c, pick(opts, Math.random())); else c.wt = 0.5;
        }
      }
    }
    if (c.beh === 'over') {
      var ob = null, og = 1e9;
      for (j = 0; j < traffic.length; j++) {
        d = traffic[j]; if (d === c || d.flip) continue;
        if (Math.abs(d.x - c.x) < (d.w + c.w) / 2 + 2 && d.y < c.y) { var gg = c.y - d.y - (c.h + d.h) / 2; if (gg < og) { og = gg; ob = d; } }
      }
      if (ob && og < 170) {
        if (c.pend == null && c.wt <= 0) { var o2 = [c.lane - 1, c.lane + 1].filter(function (l) { return l >= 0 && l < LANES && laneClear(c, l); }); if (o2.length) wantLane(c, pick(o2, Math.random()), 0.25); else c.wt = 0.3; }
        if (og < 60) { f = Math.max(f, ob.eff); c.brake = true; }
      }
    }
    if (c.beh === 'weave' && c.wt <= 0 && c.pend == null && c.y > 20 && c.y < H - 200) {
      var nl = c.lane + (Math.random() < .5 ? -1 : 1);
      if (nl >= 0 && nl < LANES) { if (c.reckless) { c.lane = nl; c.sig = 0; } else if (laneClear(c, nl)) wantLane(c, nl); }
      c.wt = 1.4 + Math.random() * 2.2 / M.aggr;
    }
    if (c.pend != null) {
      c.sigT -= dt;
      if (c.sigT <= 0) {
        if (c.reckless || laneClear(c, c.pend)) { c.lane = c.pend; c.pend = null; c.sigHold = c.big ? 1.2 : 0.7; c.wt = 1.5 + Math.random() * 2; }
        else if (c.sigT < -1.6) { c.pend = null; c.sig = 0; c.wt = 0.8; }
      }
    } else if (c.sigHold > 0) c.sigHold -= dt; else c.sig = 0;
    c.eff = f;
  }

  if (S.horn) {
    hornT -= dt;
    if (hornT <= 0) {
      hornT = 0.45;
      for (i = 0; i < traffic.length; i++) {
        c = traffic[i];
        if (c.wreck || c.beh === 'stall' || c.flip || c.pend != null) continue;
        if (Math.abs(c.x - P.x) < LANE_W * .6 && c.y < P.y && P.y - c.y < 320 && Math.random() < 0.7) {
          var ho = [c.lane - 1, c.lane + 1].filter(function (l) { return l >= 0 && l < LANES && laneClear(c, l); });
          if (ho.length) { wantLane(c, pick(ho, Math.random()), 0.3); Aud.sfx('horn'); }
        }
      }
    }
  }
  // move traffic + near misses
  for (i = traffic.length - 1; i >= 0; i--) {
    c = traffic[i];
    var py = c.y;
    c.y += speed * c.eff * dt;
    var lx = laneX(c.lane);
    c.x += (lx - c.x) * Math.min(1, dt * (c.wreck ? 0 : (c.beh === 'over' ? 5 : c.turn)));
    if (c.wreck) { c.burn -= dt; if (Math.random() < (lq() ? 0.15 : 0.45)) smoke(c.x, c.y - 4, 1); }
    if (!c.wreck && !c.near && state === 'play') {
      var crossed = (py < P.y && c.y >= P.y) || (py > P.y && c.y <= P.y);
      var ax = Math.abs(c.x - P.x);
      if (crossed && ax < LANE_W * 1.3 && ax > (c.w + P.w) / 2 - 2 && inv <= 0) {
        c.near = true; run.near++;
        var ng = Math.round(cashGain(25) * S.salv / 5) * 5; cash += ng;
        pop((c.x + P.x) / 2, P.y - 40, 'Near miss +$' + ng, '#9be7ff'); Aud.sfx('near');
      }
    }
    if (c.y > H + 140 || c.y < -400) traffic.splice(i, 1);
  }
  // traffic vs traffic crashes
  for (i = 0; i < traffic.length; i++) {
    c = traffic[i];
    for (j = i + 1; j < traffic.length; j++) {
      d = traffic[j];
      if (c.wreck && d.wreck) continue;
      if (!hit(c, d, 3)) continue;
      if (c.y < -40 || d.y < -40) { if (!c.wreck && !d.wreck) { traffic.splice(c.y < d.y ? i : j, 1); j = traffic.length; } continue; }
      var both = !c.wreck && !d.wreck, mx = (c.x + d.x) / 2, my = (c.y + d.y) / 2;
      if (!c.wreck) { c.wreck = true; c.f = c.eff = 1; c.burn = 7; }
      if (!d.wreck) { d.wreck = true; d.f = d.eff = 1; d.burn = 7; }
      explode(mx, my, both ? 1.15 : 0.8);
      pop(mx, my - 30, 'CRASH!', '#ff8a3d', true);
      if (S.hook && state === 'play') items.push({ type: 'crate', lane: c.lane, x: mx, y: my - 50, w: 30, h: 30 });
    }
  }
  // traffic vs barrels/rocks
  for (i = 0; i < traffic.length; i++) {
    c = traffic[i]; if (c.wreck) continue;
    for (j = items.length - 1; j >= 0; j--) {
      it = items[j];
      if ((it.type === 'barrel' || it.type === 'rock') && hit(c, it, 4)) {
        if (it.type === 'barrel') items.splice(j, 1);
        wreckCar(c, it.type === 'barrel' ? 1.3 : 0.9);
        break;
      }
    }
  }
  // items
  for (i = items.length - 1; i >= 0; i--) {
    it = items[i];
    it.y += speed * dt;
    var pullable = it.type === 'crate' || it.type === 'fuel' || it.type === 'bag' || it.type === 'dbl';
    if (magnet > 0 && pullable && it.y > P.y - S.magRange && it.y < P.y + 30) it.x += (P.x - it.x) * Math.min(1, dt * 5);
    if (it.y > H + 60) { items.splice(i, 1); continue; }
    var scooped = S.scoop && it.type === 'crate' && Math.abs(it.x - P.x) < LANE_W * 1.25 && Math.abs(it.y - P.y) < (P.h + it.h) / 2 - 4;
    if (!scooped && !hit(P, it, it.type === 'oil' || it.type === 'pothole' ? 8 : 4)) continue;
    if (it.type === 'rock') {
      if (S.offroad || S.plating) { items.splice(i, 1); burst(it.x, it.y, 14, '#8a7a6a', 150, 0.6, 3, 250); shakeT = Math.max(shakeT, 0.3); var rg = cashGain(20 * S.salv); cash += rg; pop(it.x, it.y, 'Crunch +$' + rg, '#d8c8a8'); }
      else if (inv <= 0) { items.splice(i, 1); burst(it.x, it.y, 14, '#8a7a6a', 150, 0.6, 3, 250); if (takeHit('Hit a rock')) return; }
    } else if (it.type === 'barrel') {
      items.splice(i, 1);
      explode(it.x, it.y, 1.1, true);
      if (S.plating) pop(P.x, P.y - 50, 'Plating held!', '#c9ccd4'); else if (takeHit('Hit a barrel')) return;
    } else if (it.type === 'oil') {
      if (!it.used && !S.offroad) {
        it.used = true;
        if (S.grip < 0.8) { slip = 0.7 * (1 - S.grip); var dir = Math.random() < .5 ? -1 : 1; var nl2 = clamp(P.lane + dir, 0, LANES - 1); P.lane = nl2; pop(P.x, P.y - 50, 'Oil slick!', '#b8b8c8'); Aud.sfx('warn'); }
      }
    } else if (it.type === 'pothole') {
      if (!it.used) { it.used = true; if (!S.offroad && !S.plating) { shakeT = Math.max(shakeT, 0.45); fuel = Math.max(1, fuel - 5); pop(P.x, P.y - 50, 'Pothole -5 fuel', '#c8b8a8'); vibe(30); } }
    } else { collect(it); items.splice(i, 1); }
  }
  // player vs traffic
  for (i = traffic.length - 1; i >= 0; i--) {
    c = traffic[i];
    if (!hit(P, c)) continue;
    if (inv <= 0) {
      if (c.wreck) { traffic.splice(i, 1); burst(c.x, c.y, 20, '#ff8a3d', 200, 0.5, 3, 0); }
      else { wreckCar(c, 0.7, true); }

}

    case 'jtake': if (save.jobs.active.length < 3 && save.jobs.active.indexOf(d('id')) < 0) { save.jobs.active.push(d('id')); persist(); Aud.sfx('buy'); } rJobs(); return;
    case 'jdrop': save.jobs.active = save.jobs.active.filter(function (x) { return x !== d('id'); }); persist(); Aud.sfx('click'); rJobs(); return;
    case 'jnew': if (spend(250)) { save.jobs.board = save.jobs.board.filter(function (b) { return save.jobs.active.indexOf(b.id) >= 0; }); fillBoard(); persist(); Aud.sfx('buy'); } else Aud.sfx('deny'); rJobs(); return;
    case 'mgroup': mGroup = d('v'); rMaps(); OV.maps.scrollTop = 0; return;
    case 'selmap': if (save.maps[d('id')]) { save.map = d('id'); persist(); prepare(); Aud.sfx('click'); rMaps(); } return;
    case 'buymap':
      m = mapById(d('id'));
      if (!save.maps[m.id] && spend(m.price)) { save.maps[m.id] = 1; save.map = m.id; persist(); prepare(); Aud.sfx('buy'); toast(m.name + ' unlocked!'); } else Aud.sfx('deny');
      rMaps(); return;
    case 'tog': SET()[d('k')] = !SET()[d('k')]; persist(); Aud.apply(); if (d('k') === 'fps') {} rSettings(); return;
    case 'set': SET()[d('k')] = d('v'); persist(); if (d('k') === 'quality') { layout(); } Aud.sfx('click'); rSettings(); return;
  }
}
appEl.addEventListener('click', function (e) {
  var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el || el.disabled) return;
  act(el.getAttribute('data-act'), el);
});
appEl.addEventListener('input', function (e) {
  if (e.target.classList && e.target.classList.contains('rng')) { SET()[e.target.getAttribute('data-k')] = parseInt(e.target.value, 10); Aud.init(); Aud.apply(); }
});
appEl.addEventListener('change', function (e) { if (e.target.classList && e.target.classList.contains('rng')) persist(); });
// PC: the mouse wheel scrolls sideways rows (filter chips, the car strip) that have no visible scrollbar
appEl.addEventListener('wheel', function (e) {
  var row = e.target.closest && e.target.closest('.chips, .cars');
  if (!row || !e.deltaY || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  if (row.scrollWidth <= row.clientWidth + 2 || getComputedStyle(row).display === 'grid') return;
  row.scrollLeft += e.deltaY; e.preventDefault();
}, { passive: false });
appEl.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  if (cur === 'name') { e.preventDefault(); doName(); }
  else if (cur === 'codes') { e.preventDefault(); doRedeem(); }
});
window.addEventListener('keydown', function (e) {
  var tg = e.target && e.target.tagName;
  if (tg === 'INPUT') return;
  if (e.key === 'Escape' && cur && ['garage', 'maps', 'jobs', 'codes', 'board'].indexOf(cur) >= 0) { show('menu'); e.preventDefault(); }
  else if (e.key === 'Escape' && cur === 'name' && nameBack) { var nb = nameBack; nameBack = null; show(nb); e.preventDefault(); }
  else if (e.key === 'Escape' && cur === 'settings') { if (setBack === 'pause') { cur = 'pause'; for (var k in OV) OV[k].hidden = k !== 'pause'; rPause(); } else show('menu'); e.preventDefault(); }
  // Enter starts a run from the menu, but not when a button has focus (the button's own click handles that)
  else if (e.key === 'Enter' && tg !== 'BUTTON' && (cur === 'menu' || cur === 'over')) { e.preventDefault(); hideAll(); startRun(); }
  else if (cur === 'help' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { helpPage = clamp(helpPage + (e.key === 'ArrowRight' ? 1 : -1), 0, HELP.length - 1); rHelp(); e.preventDefault(); }
  else if (e.key === 'Escape' && cur === 'help') { show('menu'); e.preventDefault(); }
});
pauseBtn.addEventListener('click', function () { Aud.init(); pauseGame(); });
UIH.pause = function () { cur = 'pause'; for (var k in OV) OV[k].hidden = k !== 'pause'; pauseBtn.hidden = true; rPause(); };
UIH.play = function () { hideAll(); pauseBtn.hidden = false; };
UIH.over = function (res) { cur = 'over'; for (var k in OV) OV[k].hidden = k !== 'over'; pauseBtn.hidden = true; rOver(res); };
// patch the settings "back" button to return to pause when opened from pause
OV.settings.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-act="go"]');
  if (b && setBack === 'pause') { e.stopPropagation(); cur = 'pause'; for (var k in OV) OV[k].hidden = k !== 'pause'; rPause(); }
}, true);

/* ---------- boot ---------- */
function boot() {
  layout(); prepare();
  requestAnimationFrame(frame);
  gView = save.car;
  if (save.refundNote) {
    var rn = save.refundNote; delete save.refundNote; persist();
    setTimeout(function () { toast('Game update: ' + fmt(rn) + ' refunded for removed items', 3600); }, 600);
  } else persist();
  show(save.name ? 'menu' : 'name');
  // put players' existing best run on the online leaderboard, and retry any score that didn't send last time
  if (save.name && save.best > (save.lbBest || 0) && !save.lbQueue) {
    save.lbQueue = { name: save.name.slice(0, 12), score: Math.min(100000000, save.best), car: carById(save.car).name.slice(0, 24), map: mapById(save.map).name.slice(0, 24) };
    persist();
  }
  lbFlush();
  checkForUpdate();
}
boot();
// developer test hooks: only exist when the page is opened with ?crtest in the address
if (window.__CR_TEST || /[?&]crtest\b/.test(location.search)) window.__CR = {
  drawCar: function (canvas, id, look) { preview(canvas, carById(id), 4.2, look || {}); },
  save: function () { return save; }, persist: persist, show: show, start: startRun, prepare: prepare,
  st: function () { return { state: state, cash: cash, t: t, traffic: traffic.length, booms: run.booms, lives: lives, fuel: fuel, parts: parts.length, W: W, H: H }; },
  inject: function (kind, lane, y, beh, sig) { var old = pool; pool = [kind]; var c = mkCar(lane, y, beh === 'stall' ? 1 : 0.6, beh || 'norm'); pool = old; if (beh === 'stall') c.sig = 2; if (sig) { c.pend = lane + sig; c.sigT = 99; c.sig = sig; } traffic.push(c); return traffic.length; },
  clear: function () { traffic.length = 0; items.length = 0; },
  freeze: function () { state = 'paused'; },
  god: function () { lives = 99; maxLives = 3; fuel = 100; },
  sim: function (n, ghost) { for (var i = 0; i < n && state !== 'over'; i++) { if (state === 'count') countT = 0; if (ghost) { inv = 5; fuel = 100; } if (Math.random() < 0.03) move(Math.random() < .5 ? -1 : 1); update(1 / 60); } return { state: state, t: t, cash: cash, booms: run.booms, near: run.near, crates: run.crates, traffic: traffic.length, items: items.length, parts: parts.length }; }, boom: function () { explode(W / 2, H * 0.35, 1.2, true); traffic.push(mkCar(1, 200, 0.5)); traffic[traffic.length - 1].wreck = true; }
};

})();
</script>
